phase = 10
name = "Seeing further"
about = """
The championship with the end of phase 9 added, the places set by the last hour of phase 9's own
training games, and a look-ahead teacher in a share of the games. It plays out every choice of
tickets and a tenth of the other decisions at a table of two, fewer at the larger tables. The
network's first choice and up to three other options are each played to the end in eight worlds,
the hidden cards dealt afresh and every seat moving by samples of the policy. An option that comes
out ahead is played again with the first choice in 24 fresh worlds, and becomes a lesson only if it
is still ahead by three points and by two standard errors.
"""

