<text x="24" y="34" class="t" font-size="15" font-weight="600">Against phase 5: first places by table</text>
<text x="24" y="56" class="s" font-size="12">The share of the training games against phase 5 the network finished first at each table size, a point every 100 games or</text>
<text x="24" y="72" class="s" font-size="12">more, and the mean of the tables; the dots are the measured matches (about 400 games a table, the network moving as it</text>
<text x="24" y="88" class="s" font-size="12">trains) with their 95 % interval.</text>
