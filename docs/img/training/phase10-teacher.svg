<rect x="0.5" y="0.5" width="759" height="385" rx="10" class="bg"/>
<text x="24" y="34" class="t" font-size="15" font-weight="600">Look-ahead teacher: proven finds a game</text>
<text x="24" y="56" class="s" font-size="12">In the teacher&#x27;s games the look-ahead plays the network&#x27;s first choice and its alternatives out to the end in sampled</text>
<text x="24" y="72" class="s" font-size="12">deals; a find is a move proved better by 3 points and 2 standard errors, and becomes a lesson. Finds per teacher&#x27;s game,</text>
<text x="24" y="88" class="s" font-size="12">a point every 100 games or more.</text>
