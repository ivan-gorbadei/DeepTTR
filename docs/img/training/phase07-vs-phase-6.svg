<text x="24" y="56" class="s" font-size="12">The share of the training games against phase 6 the network finished first at each table size, a point every 100 games or</text>
<text x="24" y="72" class="s" font-size="12">more, and the mean of the tables; the dots are the measured matches (about 400 games a table, the network moving as it</text>
