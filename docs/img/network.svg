<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="The DeepTTR network: 209 tokens of seven kinds, six transformer layers whose attention is biased by the relations of the map, and the outputs read from the tokens they are about.">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.surface { fill: #fcfcfb; stroke: #e1e0d9; }
.box { fill: #f4f3ef; stroke: #c3c2b7; stroke-width: 1; }
.inner { fill: #fcfcfb; stroke: #c3c2b7; stroke-width: 1; }
.accent { fill: #fcfcfb; stroke: #2a78d6; stroke-width: 1.5; }
.wire { stroke: #898781; stroke-width: 1.5; fill: none; }
.tip { fill: #898781; }
.head { font-size: 12px; fill: #52514e; letter-spacing: 0.04em; }
.t { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
.s { font-size: 11.5px; fill: #52514e; }
.note { font-size: 12.5px; fill: #0b0b0b; }
.k-routes { fill: #2a78d6; }
.k-cities { fill: #eb6834; }
.k-tickets { fill: #1baf7a; }
.k-seats { fill: #eda100; }
.k-table { fill: #e87ba4; }
.k-slots { fill: #008300; }
.k-events { fill: #6250d6; }

@media (prefers-color-scheme: dark) {
.surface { fill: #1a1a19; stroke: #2c2c2a; }
.box { fill: #242422; stroke: #45453f; }
.inner { fill: #1a1a19; stroke: #45453f; }
.accent { fill: #1a1a19; stroke: #3987e5; }
.head { fill: #c3c2b7; }
.t { fill: #f0efec; }
.s { fill: #c3c2b7; }
.note { fill: #f0efec; }
.k-routes { fill: #3987e5; }
.k-cities { fill: #d95926; }
.k-tickets { fill: #199e70; }
.k-seats { fill: #c98500; }
.k-table { fill: #d55181; }
.k-slots { fill: #0ca30c; }
.k-events { fill: #9085e9; }
}
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="tip"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="579" rx="10" class="surface"/>
<text x="24" y="34" class="head" text-anchor="start">WHAT ONE SEAT SEES</text>
<text x="262" y="34" class="head" text-anchor="start">TOKENS</text>
<text x="412" y="34" class="head" text-anchor="start">TRUNK</text>
<text x="690" y="34" class="head" text-anchor="start">OUTPUTS</text>
<rect x="24" y="52" width="206" height="46" rx="8" class="box"/>
<rect x="24" y="52" width="6" height="46" rx="3" class="k-routes"/>
<text x="42" y="72" class="t" text-anchor="start">Routes</text>
<text x="42" y="88" class="s" text-anchor="start">100 tokens, 36 features each</text>
<line x1="234" y1="75" x2="258" y2="75" class="wire" marker-end="url(#head)"/>
<rect x="24" y="108" width="206" height="46" rx="8" class="box"/>
<rect x="24" y="108" width="6" height="46" rx="3" class="k-cities"/>
<text x="42" y="128" class="t" text-anchor="start">Cities</text>
<text x="42" y="144" class="s" text-anchor="start">36 tokens, 8 features</text>
<line x1="234" y1="131" x2="258" y2="131" class="wire" marker-end="url(#head)"/>
<rect x="24" y="164" width="206" height="46" rx="8" class="box"/>
<rect x="24" y="164" width="6" height="46" rx="3" class="k-tickets"/>
<text x="42" y="184" class="t" text-anchor="start">Tickets</text>
<text x="42" y="200" class="s" text-anchor="start">30 tokens, 5 features</text>
<line x1="234" y1="187" x2="258" y2="187" class="wire" marker-end="url(#head)"/>
<rect x="24" y="220" width="206" height="46" rx="8" class="box"/>
<rect x="24" y="220" width="6" height="46" rx="3" class="k-seats"/>
<text x="42" y="240" class="t" text-anchor="start">Seats</text>
<text x="42" y="256" class="s" text-anchor="start">5 tokens, 40 features</text>
<line x1="234" y1="243" x2="258" y2="243" class="wire" marker-end="url(#head)"/>
<rect x="24" y="276" width="206" height="46" rx="8" class="box"/>
<rect x="24" y="276" width="6" height="46" rx="3" class="k-table"/>
<text x="42" y="296" class="t" text-anchor="start">Table</text>
<text x="42" y="312" class="s" text-anchor="start">1 token, 58 features</text>
<line x1="234" y1="299" x2="258" y2="299" class="wire" marker-end="url(#head)"/>
<rect x="24" y="332" width="206" height="46" rx="8" class="box"/>
<rect x="24" y="332" width="6" height="46" rx="3" class="k-slots"/>
<text x="42" y="352" class="t" text-anchor="start">Face-up cards</text>
<text x="42" y="368" class="s" text-anchor="start">5 tokens, the card in each slot</text>
<line x1="234" y1="355" x2="258" y2="355" class="wire" marker-end="url(#head)"/>
<rect x="24" y="388" width="206" height="46" rx="8" class="box"/>
<rect x="24" y="388" width="6" height="46" rx="3" class="k-events"/>
<text x="42" y="408" class="t" text-anchor="start">Events</text>
<text x="42" y="424" class="s" text-anchor="start">32 tokens, the last public moves</text>
<line x1="234" y1="411" x2="258" y2="411" class="wire" marker-end="url(#head)"/>
<rect x="262" y="52" width="118" height="382" rx="8" class="box"/>
<text x="321" y="196" class="t" text-anchor="middle">Embedding</text>
<text x="321" y="216" class="s" text-anchor="middle">a linear layer</text>
<text x="321" y="231" class="s" text-anchor="middle">over the features</text>
<text x="321" y="246" class="s" text-anchor="middle">plus an embedding</text>
<text x="321" y="261" class="s" text-anchor="middle">of which route, city,</text>
<text x="321" y="276" class="s" text-anchor="middle">ticket or seat it is</text>
<text x="321" y="318" class="t" text-anchor="middle">209 tokens</text>
<text x="321" y="334" class="s" text-anchor="middle">of width 256</text>
<line x1="384" y1="243" x2="408" y2="243" class="wire" marker-end="url(#head)"/>
<rect x="412" y="52" width="236" height="382" rx="8" class="box"/>
<text x="530" y="78" class="t" text-anchor="middle">Transformer, 6 layers</text>
<text x="530" y="95" class="s" text-anchor="middle">width 256, 4 heads</text>
<rect x="428" y="112" width="204" height="130" rx="6" class="inner"/>
<text x="530" y="135" class="t" text-anchor="middle">Self-attention</text>
<text x="530" y="153" class="s" text-anchor="middle">every token attends to</text>
<text x="530" y="168" class="s" text-anchor="middle">all 209 tokens</text>
<rect x="442" y="186" width="176" height="40" rx="6" class="accent"/>
<text x="530" y="203" class="s" text-anchor="middle">plus a learned bias for</text>
<text x="530" y="218" class="s" text-anchor="middle">the pair's relation on the map</text>
<rect x="428" y="258" width="204" height="62" rx="6" class="inner"/>
<text x="530" y="282" class="t" text-anchor="middle">MLP</text>
<text x="530" y="300" class="s" text-anchor="middle">256 to 1,024 to 256</text>
<text x="530" y="352" class="s" text-anchor="middle">The same 209 tokens come out,</text>
<text x="530" y="367" class="s" text-anchor="middle">each now informed by</text>
<text x="530" y="382" class="s" text-anchor="middle">the whole position.</text>
<rect x="412" y="470" width="236" height="88" rx="8" class="accent"/>
<text x="530" y="492" class="t" text-anchor="middle">The board, built in</text>
<text x="530" y="510" class="s" text-anchor="middle">16 relations between tokens: a route</text>
<text x="530" y="525" class="s" text-anchor="middle">and its cities, routes sharing a city,</text>
<text x="530" y="540" class="s" text-anchor="middle">a ticket and its ends, city distance</text>
<line x1="530" y1="466" x2="530" y2="438" class="wire" marker-end="url(#head)"/>
<rect x="690" y="52" width="286" height="136" rx="8" class="box"/>
<text x="704" y="75" class="t" text-anchor="start">Policy: 422 moves</text>
<circle cx="709" cy="94" r="5" class="k-routes"/>
<text x="722" y="98" class="s" text-anchor="start">408 route claims, from the route tokens</text>
<circle cx="709" cy="116" r="5" class="k-slots"/>
<text x="722" y="120" class="s" text-anchor="start">5 face-up draws, from the slot tokens</text>
<circle cx="709" cy="138" r="5" class="k-table"/>
<text x="722" y="142" class="s" text-anchor="start">deck draw and ticket draw, from the table token</text>
<circle cx="709" cy="160" r="5" class="k-tickets"/>
<text x="722" y="164" class="s" text-anchor="start">7 ways to keep tickets, from the ticket tokens</text>
<rect x="690" y="200" width="286" height="56" rx="8" class="box"/>
<text x="704" y="223" class="t" text-anchor="start">Value and final score of every seat</text>
<text x="704" y="241" class="s" text-anchor="start">pooled by attention over all tokens</text>
<rect x="690" y="268" width="286" height="56" rx="8" class="box"/>
<text x="704" y="291" class="t" text-anchor="start">Belief</text>
<text x="704" y="309" class="s" text-anchor="start">which seat holds which ticket</text>
<rect x="690" y="336" width="286" height="72" rx="8" class="box"/>
<text x="704" y="359" class="t" text-anchor="start">Auxiliary forecasts</text>
<text x="704" y="377" class="s" text-anchor="start">who ends with each route, ticket outcomes,</text>
<text x="704" y="392" class="s" text-anchor="start">hands, trains still needed, longest trail</text>
<rect x="690" y="420" width="286" height="56" rx="8" class="box"/>
<text x="704" y="443" class="t" text-anchor="start">Critic and per-move forecast</text>
<text x="704" y="461" class="s" text-anchor="start">used in training</text>
<line x1="648" y1="243" x2="669" y2="243" class="wire"/>
<line x1="669" y1="120" x2="669" y2="448" class="wire"/>
<line x1="669" y1="120" x2="686" y2="120" class="wire" marker-end="url(#head)"/>
<line x1="669" y1="228" x2="686" y2="228" class="wire" marker-end="url(#head)"/>
<line x1="669" y1="296" x2="686" y2="296" class="wire" marker-end="url(#head)"/>
<line x1="669" y1="372" x2="686" y2="372" class="wire" marker-end="url(#head)"/>
<line x1="669" y1="448" x2="686" y2="448" class="wire" marker-end="url(#head)"/>
<text x="24" y="500" class="note" text-anchor="start">7,711,871 parameters.</text>
<text x="24" y="520" class="note" text-anchor="start">The policy answers in one forward pass.</text>
<text x="24" y="540" class="s" text-anchor="start">Seats are relative to the observer;</text>
<text x="24" y="555" class="s" text-anchor="start">hidden cards and tickets are never an input.</text>
</svg>
