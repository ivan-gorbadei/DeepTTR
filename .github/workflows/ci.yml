name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            torch: "--index-url https://download.pytorch.org/whl/cpu"
          - os: windows-latest
            torch: "--index-url https://download.pytorch.org/whl/cpu"
          - os: macos-latest
            torch: ""
    env:
      # no GPU on the runners: everything runs on the CPU, and a missing engine fails instead of skipping
      DEEPTTR_DEVICE: cpu
      DEEPTTR_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Engine - format, lints, tests
        working-directory: engine
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p deepttr-core --release

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch ${{ matrix.torch }}
          python -m pip install -e ".[test]"

      - name: Python tests
        run: python -m pytest -q

  readme:
    # the commands of the README's "Play against it", word for word: the clone (of this commit), the
    # install, and the play server answering a new game
    name: README on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      README_CLONE_FROM: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: The commands for Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          block="$GITHUB_WORKSPACE/.github/scripts/readme_block.py"
          python "$block" sh install | tee install.sh
          bash -euo pipefail install.sh
          cd DeepTTR
          python "$block" sh run | tee run.sh
          bash run.sh > serve.log 2>&1 &
          for i in $(seq 120); do curl -fs http://127.0.0.1:8080/ > /dev/null && break; sleep 2; done
          cat serve.log
          curl -fs http://127.0.0.1:8080/ | grep -q "Ticket to Ride"
          curl -fs -X POST -H "Content-Type: application/json" -d '{"name": "CI", "consent": false, "seat": 0}' \
            http://127.0.0.1:8080/api/new | grep -q '"phase": "keep"'
          pkill -f deepttr.serve

      - name: The commands for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $block = "$env:GITHUB_WORKSPACE/.github/scripts/readme_block.py"
          foreach ($line in (python $block powershell install) -split "`r?`n") { "PS> $line"; Invoke-Expression $line }
          $run = python $block powershell run
          "PS> $run"
          Start-Process pwsh -ArgumentList "-NoProfile", "-Command", $run -WorkingDirectory (Get-Location).Path `
            -RedirectStandardOutput serve.log -RedirectStandardError serve.err
          foreach ($i in 1..120) { try { Invoke-WebRequest http://127.0.0.1:8080/ -TimeoutSec 3 | Out-Null; break } catch { Start-Sleep 2 } }
          Get-Content serve.log
          if ((Invoke-WebRequest http://127.0.0.1:8080/).Content -notmatch "Ticket to Ride") { throw "not the play page" }
          $game = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"name": "CI", "consent": false, "seat": 0}' `
            http://127.0.0.1:8080/api/new
          if ($game.view.phase -ne "keep") { throw "a new game does not start with the choice of tickets" }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "deepttr\.serve" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
